plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mini.tvlive'
    compileSdk 34

    defaultConfig {
        applicationId "com.mini.tvlive"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        // 和 v1 用同一套签名，覆盖安装不会冲突
        release {
            storeFile file("../tools/demo.jks")
            storePassword "tvlive123"
            keyAlias "tvlive"
            keyPassword "tvlive123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
}
